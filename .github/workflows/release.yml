name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Leaf CLI version, for example 0.1.18"
        required: true
      ref:
        description: "Leaf source branch, tag, or commit"
        required: true
        default: master

permissions:
  contents: write

concurrency:
  group: leaf-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$REQUESTED_VERSION"
            REF="$REQUESTED_REF"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            REF="$GITHUB_REF_NAME"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'ref=%s\n' "$REF" >> "$GITHUB_OUTPUT"

      - name: Check out Leaf source
        uses: actions/checkout@v5
        with:
          repository: aiirobyte/leaf
          ref: ${{ steps.release.outputs.ref }}
          token: ${{ secrets.LEAF_SOURCE_TOKEN }}
          path: leaf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        working-directory: leaf
        run: bun install --frozen-lockfile

      - name: Verify
        working-directory: leaf
        run: >-
          bun run typecheck &&
          bun test --max-concurrency=1 --timeout=30000
          apps/runner/test/service.test.ts
          apps/runner/test/maintenance.test.ts
          apps/runner/test/local-models.test.ts
          packages/rowan-ext/test/process.test.ts
          scripts/install.test.ts
          scripts/publish-cli-release.test.ts
          scripts/r2-client.test.ts
          scripts/release-cli.test.ts
          scripts/verify-cli-release.test.ts
          apps/server/test/install-scripts.test.ts
          apps/server/test/cli-releases.test.ts

      - name: Build CLI artifacts
        working-directory: leaf
        env:
          LEAF_DEFAULT_SERVER_URL: ${{ vars.LEAF_DEFAULT_SERVER_URL }}
        run: |
          test -n "$LEAF_DEFAULT_SERVER_URL"
          bun run release:cli --version "${{ steps.release.outputs.version }}" --out dist/cli

      - name: Verify CLI artifacts
        working-directory: leaf
        run: bun scripts/verify-cli-release.ts "dist/cli/${{ steps.release.outputs.version }}"

      - name: Publish GitHub Release and R2 mirror
        working-directory: leaf
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          LEAF_CLI_RELEASES_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: >-
          bun scripts/publish-cli-release.ts
          --version "${{ steps.release.outputs.version }}"
          --assets "dist/cli/${{ steps.release.outputs.version }}"
          --repo "${{ github.repository }}"
          --target main

      - name: Smoke test the public latest manifest
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASES_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: |
          curl -fsSL "$RELEASES_URL/releases/cli/latest.json" -o /tmp/leaf-latest.json
          grep -q "\"version\": \"$VERSION\"" /tmp/leaf-latest.json
